[package]
name = "mizan-okane"
version = "1.0.0"
description = "Mizan Okane Desktop Application"
authors = ["mizoarkatamarenaldy"]
edition = "2021"

[lib]
name = "mizan_okane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.10"
base64 = "0.23"
url = "2.5"
getrandom = "0.3"
