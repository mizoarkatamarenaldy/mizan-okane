<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizan Okane</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#4CAF50">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h1 style="margin-bottom: 0;">Mizan Okane</h1>
                <button id="btn-install" class="btn-primary hidden" style="font-size: 12px; padding: 6px 12px; flex: none;">Install Aplikasi</button>
            </div>
            <section class="sync-bar" aria-label="Sinkron Google Drive">
                <p id="sync-status" class="sync-status" role="status" aria-live="polite">Belum login. Data hanya tersimpan di perangkat ini.</p>
                <div class="sync-actions">
                    <button type="button" id="btn-sync-now" class="btn-secondary btn-small hidden">Sinkron</button>
                    <button type="button" id="btn-logout" class="btn-secondary btn-small hidden">Logout</button>
                    <button type="button" id="btn-login" class="btn-primary btn-small">Login Google</button>
                </div>
                <div id="sync-conflict" class="sync-conflict hidden">
                    <p>Data di Drive dan di perangkat ini sama-sama berubah sejak sinkron terakhir. Pilih satu untuk dipakai, yang lain akan ditimpa.</p>
                    <div class="sync-actions">
                        <button type="button" id="btn-use-drive" class="btn-secondary btn-small">Pakai data Drive</button>
                        <button type="button" id="btn-use-local" class="btn-secondary btn-small">Pakai data perangkat ini</button>
                    </div>
                </div>
            </section>
            <div class="summary">
                <div class="summary-item balance">
                    <span>Total Saldo</span>
                    <strong id="total-balance">Rp 0</strong>
                </div>
                <div class="summary-row">
                    <div class="summary-item income">
                        <span>Pemasukan</span>
                        <strong id="total-income">Rp 0</strong>
                    </div>
                    <div class="summary-item expense">
                        <span>Pengeluaran</span>
                        <strong id="total-expense">Rp 0</strong>
                    </div>
                </div>
            </div>
        </header>

        <section class="form-section">
            <h2 id="form-title">Tambah Transaksi</h2>
            <form id="tx-form">
                <input type="hidden" id="tx-id">
                
                <div class="form-group">
                    <label>Tipe Transaksi</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="type" value="expense" checked>
                            Pengeluaran
                        </label>
                        <label>
                            <input type="radio" name="type" value="income">
                            Pemasukan
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="tx-date">Tanggal</label>
                    <input type="date" id="tx-date" required>
                </div>

                <div class="form-group">
                    <label for="tx-amount">Jumlah (Rp)</label>
                    <input type="number" id="tx-amount" min="1" step="1" required>
                </div>

                <div class="form-group">
                    <label for="tx-category">Kategori</label>
                    <input type="text" id="tx-category" list="category-list" required autocomplete="off">
                    <datalist id="category-list">
                        <option value="Makan"></option>
                        <option value="Transport"></option>
                        <option value="Belanja"></option>
                        <option value="Tagihan"></option>
                        <option value="Pendidikan"></option>
                        <option value="Hiburan"></option>
                        <option value="Gaji"></option>
                        <option value="Lainnya"></option>
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="tx-note">Catatan (opsional)</label>
                    <input type="text" id="tx-note">
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-save" class="btn-primary">Simpan</button>
                    <button type="button" id="btn-cancel" class="btn-secondary hidden">Batal</button>
                </div>
            </form>
        </section>

        <section class="list-section">
            <h2>Riwayat Transaksi</h2>
            <div id="tx-list" class="tx-list">
                <!-- Data will be populated here -->
            </div>
        </section>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
